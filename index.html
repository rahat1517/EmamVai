<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Good Boy Animation - Mobile UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            overflow-x: hidden;
        }

        /* Hidden Audio Container */
        #youtube-audio-container {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .mobile-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 24px 18px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 380px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #38bdf8;
            letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            font-size: 1.05rem;
            font-weight: 500;
            padding: 14px 16px;
            background: rgba(51, 65, 85, 0.5);
            border-radius: 14px;
            border-left: 4px solid #38bdf8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Mobile Snake Animation Area */
        .snake-container {
            margin-top: 24px;
            padding: 16px 10px;
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(34, 197, 94, 0.2));
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .snake-text {
            font-size: 1.6rem;
            font-weight: 800;
            display: inline-block;
            white-space: nowrap;
        }

        .snake-text span {
            display: inline-block;
            color: #38bdf8;
            animation: mobileSnakeWave 1.2s infinite ease-in-out;
        }

        /* Snake Wave Animation Delays */
        .snake-text span:nth-child(1) { animation-delay: 0.0s; }
        .snake-text span:nth-child(2) { animation-delay: 0.1s; }
        .snake-text span:nth-child(3) { animation-delay: 0.2s; }
        .snake-text span:nth-child(4) { animation-delay: 0.3s; }
        .snake-text span:nth-child(5) { animation-delay: 0.4s; }
        .snake-text span:nth-child(6) { animation-delay: 0.5s; }
        .snake-text span:nth-child(7) { animation-delay: 0.6s; }
        .snake-text span:nth-child(8) { animation-delay: 0.7s; }
        .snake-text span:nth-child(9) { animation-delay: 0.8s; }
        .snake-text span:nth-child(10) { animation-delay: 1.0s; }
        .snake-text span:nth-child(11) { animation-delay: 1.1s; }

        @keyframes mobileSnakeWave {
            0%, 100% {
                transform: translateY(0);
                color: #38bdf8;
            }
            50% {
                transform: translateY(-12px);
                color: #4ade80;
                text-shadow: 0 0 8px #4ade80;
            }
        }
    </style>
</head>
<body>

    <!-- Hidden YouTube Player -->
    <div id="youtube-audio-container">
        <div id="player"></div>
    </div>

    <div class="mobile-card">
        <div class="title">✨ চোদনা List ✨</div>
        
        <div class="list-container">
            <div class="list-item"><span>🌟</span> চোদনা Emam</div>
            <div class="list-item"><span>🌟</span> পাইথন Hasan</div>
            <div class="list-item"><span>🌟</span> সাপ Chowdhury</div>
            <div class="list-item"><span>★</span> সাদা ছেলে ইমাম</div>
        </div>

        <!-- Snake Animation Text -->
        <div class="snake-container">
            <div class="snake-text">
                <span>P</span><span>y</span><span>t</span><span>h</span><span>o</span><span>n</span>
                <span>&nbsp;</span>
                <span>E</span><span>m</span><span>a</span><span>m</span>
            </div>
        </div>
    </div>

    <!-- YouTube iframe API for Autoplay -->
    <script>
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: 'Gs7qKgMGgT4',
                playerVars: {
                    'autoplay': 1,
                    'mute': 1,           /* অটোপ্লে চালু করার ট্রিক */
                    'loop': 1,
                    'playlist': 'Gs7qKgMGgT4',
                    'controls': 0,
                    'playsinline': 1
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        function onPlayerReady(event) {
            // প্লেয়ার স্টার্ট করার পর অডিও আনমিউট করা
            event.target.playVideo();
            
            setTimeout(function() {
                event.target.unMute();
                event.target.setVolume(100);
            }, 1000);
        }
    </script>
</body>
</html>
